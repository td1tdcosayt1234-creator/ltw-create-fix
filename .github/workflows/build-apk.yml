name: Build LTW APK (Create fix)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "25.2.9519653"
    steps:
      - name: Checkout (with glsl_optimizer submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: >-
            ndk;${{ env.NDK_VERSION }}
            build-tools;33.0.2
            platforms;android-33

      - name: Build libltw.so with ndk-build
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}
          $ANDROID_NDK_HOME/ndk-build \
            APP_ABI="arm64-v8a armeabi-v7a" \
            NDK_PROJECT_PATH=ltw/src/main/tinywrapper \
            APP_BUILD_SCRIPT=ltw/src/main/tinywrapper/Android.mk
          ls -R ltw/src/main/tinywrapper/libs

      - name: Stage native libs into the APK module
        run: |
          mkdir -p apk_app/src/main/jniLibs
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p apk_app/src/main/jniLibs/$abi
            cp ltw/src/main/tinywrapper/libs/$abi/libltw.so apk_app/src/main/jniLibs/$abi/libltw.so
          done
          ls -R apk_app/src/main/jniLibs

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.4
          arguments: :apk_app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ltw-lite-apk
          path: apk_app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
